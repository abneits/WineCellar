version: "3.9"

services:
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=${TEST_DATABASE_URL}
      - QUEUE_DATABASE_URL=
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8081}
      - N8N_PAIRING_WEBHOOK_URL=
      - SERVER_PORT=8080
      - CORS_ORIGINS=*
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-10}
    restart: "no"
